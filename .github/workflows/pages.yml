name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Package static website
        run: node scripts/build-pages.cjs "$RUNNER_TEMP/travel-map-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/travel-map-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: '1800000'
