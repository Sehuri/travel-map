<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的旅行足迹</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  --bg-deep: #0a0e27;
  --bg-mid: #1a1040;
  --bg-light: #0d1b3e;
  --gold: #d4af37;
  --gold-light: #f5d76e;
  --cyan: #4fc3f7;
  --card-bg: rgba(255,255,255,0.04);
  --text: #e0e0e0;
  --text-dim: #8892b0;
  --border-dim: rgba(255,255,255,0.06);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: "PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background: linear-gradient(170deg, #0a0e27 0%, #1a1040 40%, #0d1b3e 100%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ===== STAR PARTICLES ===== */
.stars {
  position: fixed; inset:0; pointer-events:none; z-index:0;
}
.star {
  position: absolute;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  animation-delay: var(--delay);
  opacity: 0;
}
@keyframes twinkle {
  0%,100% { opacity:0.1; transform:scale(1); }
  50% { opacity:0.9; transform:scale(1.6); }
}

/* ===== HERO ===== */
.hero {
  position:relative; z-index:1;
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  background: radial-gradient(ellipse at 50% 30%, rgba(26,36,86,0.5) 0%, transparent 70%);
}
.hero-content { position:relative; z-index:1; }
.hero-badge {
  display:inline-block; padding:6px 20px;
  border:1px solid rgba(212,175,55,0.4); border-radius:20px;
  font-size:13px; color:var(--gold);
  letter-spacing:2px; margin-bottom:24px;
  background:rgba(212,175,55,0.05);
}
.hero h1 {
  font-size:clamp(2.5rem,7vw,5rem); font-weight:800;
  background:linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:16px; line-height:1.2;
}
.hero-sub { font-size:clamp(1rem,2.5vw,1.3rem); color:var(--text-dim); margin-bottom:48px; font-weight:300; }
.stats { display:flex; gap:40px; justify-content:center; flex-wrap:wrap; }
.stat-item { text-align:center; min-width:120px; }
.stat-number { font-size:clamp(2rem,5vw,3.5rem); font-weight:800; color:var(--gold); line-height:1; }
.stat-label { font-size:13px; color:var(--text-dim); margin-top:8px; letter-spacing:1px; }
.scroll-hint {
  position:absolute; bottom:32px; left:50%; transform:translateX(-50%);
  color:var(--text-dim); font-size:13px; animation:bounce 2s infinite;
}
.scroll-hint::after {
  content:''; display:block; width:20px; height:20px; margin:8px auto 0;
  border-right:2px solid var(--gold); border-bottom:2px solid var(--gold);
  transform:rotate(45deg); opacity:0.6;
}
@keyframes bounce {
  0%,100% { transform:translateX(-50%) translateY(0); }
  50% { transform:translateX(-50%) translateY(8px); }
}

/* ===== SECTION ===== */
.section { position:relative; z-index:1; padding:80px 24px; max-width:1400px; margin:0 auto; }
.section-title {
  font-size:clamp(1.6rem,4vw,2.4rem); font-weight:700; text-align:center;
  margin-bottom:12px; color:var(--text);
}
.section-title span {
  background:linear-gradient(135deg, var(--gold), var(--gold-light));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.section-sub { text-align:center; color:var(--text-dim); margin-bottom:48px; font-size:15px; }

/* ===== MAP ===== */
.map-section { background:linear-gradient(180deg, #0a0e27 0%, #0d1233 100%); }
.map-wrapper {
  border-radius:16px; overflow:hidden;
  border:1px solid rgba(212,175,55,0.15);
  background:rgba(13,18,51,0.6);
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
#mapContainer { width:100%; height:600px; }
.map-legend { display:flex; justify-content:center; gap:32px; padding:16px; background:rgba(0,0,0,0.3); border-top:1px solid rgba(255,255,255,0.05); }
.legend-item { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); }
.legend-dot { width:12px; height:12px; border-radius:50%; }
.legend-dot.visited { background:radial-gradient(circle, var(--gold-light), var(--gold)); box-shadow:0 0 8px rgba(212,175,55,0.6); }
.legend-dot.wish { border:2px dashed var(--cyan); background:transparent; }

/* ===== TAB BUTTONS ===== */
.tab-nav {
  display:flex; justify-content:center; gap:16px;
  margin-bottom:48px;
  flex-wrap:wrap;
}
.tab-btn {
  padding:14px 36px; border-radius:40px;
  font-size:16px; font-weight:600; cursor:pointer;
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.04);
  color:var(--text-dim);
  transition:all 0.35s ease;
  user-select:none;
  letter-spacing:1px;
}
.tab-btn:hover {
  border-color:rgba(212,175,55,0.3);
  color:var(--gold);
}
.tab-btn.active {
  background:linear-gradient(135deg, rgba(212,175,55,0.25) 0%, rgba(212,175,55,0.08) 100%);
  border-color:var(--gold);
  color:var(--gold);
  box-shadow:0 0 20px rgba(212,175,55,0.15);
}

/* ===== TAB PANEL ===== */
.tab-panel {
  display:none;
  opacity:0;
  transition:opacity 0.4s ease;
}
.tab-panel.active {
  display:block;
  animation:fadeInUp 0.5s ease forwards;
}
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(24px); }
  to { opacity:1; transform:translateY(0); }
}

/* ===== VISITED CARD GRID ===== */
.visited-grid {
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px;
}

/* ===== VISITED CARD ===== */
.vcard {
  background:var(--card-bg);
  border:1px solid var(--border-dim);
  border-radius:14px;
  padding:20px;
  transition:all 0.35s ease;
  position:relative;
  overflow:hidden;
}
.vcard::before {
  content:''; position:absolute; inset:0;
  border-radius:14px;
  background:linear-gradient(135deg, rgba(212,175,55,0.06), transparent);
  opacity:0; transition:opacity 0.3s;
}
.vcard:hover {
  transform:translateY(-4px);
  border-color:rgba(212,175,55,0.3);
  box-shadow:0 0 20px rgba(180,160,100,0.15);
}
.vcard:hover::before { opacity:1; }

.vcard-name {
  font-size:18px; font-weight:700; color:var(--text);
  margin-bottom:6px;
}
.vcard-date {
  font-size:12px; color:var(--text-dim);
  margin-bottom:12px;
}
.vcard-desc {
  font-size:13px; color:var(--text-dim);
  line-height:1.6;
  margin-bottom:16px;
}

/* ===== PHOTO UPLOAD AREA ===== */
.vcard-photos {
  display:flex; flex-wrap:wrap; gap:6px;
  margin-bottom:8px;
}
.vcard-photo-thumb {
  width:56px; height:56px; border-radius:6px;
  object-fit:cover; cursor:pointer;
  border:1px solid rgba(255,255,255,0.1);
  transition:transform 0.2s;
}
.vcard-photo-thumb:hover { transform:scale(1.1); z-index:2; }

.upload-trigger {
  display:flex; align-items:center; justify-content:center;
  width:64px; height:64px;
  border:2px dashed rgba(255,255,255,0.15);
  border-radius:8px;
  cursor:pointer;
  font-size:20px;
  color:var(--text-dim);
  transition:all 0.25s;
  flex-shrink:0;
}
.upload-trigger:hover {
  border-color:var(--gold);
  color:var(--gold);
  background:rgba(212,175,55,0.05);
}
.upload-trigger.full {
  opacity:0.4; cursor:not-allowed;
}
.vcard-photo-count {
  font-size:10px; color:var(--text-dim);
  align-self:center;
}

/* ===== LIGHTBOX ===== */
.lightbox-overlay {
  display:none; position:fixed; inset:0; z-index:9999;
  background:rgba(0,0,0,0.9);
  align-items:center; justify-content:center;
  cursor:pointer;
}
.lightbox-overlay.show { display:flex; }
.lightbox-overlay img {
  max-width:90vw; max-height:90vh;
  border-radius:8px;
  object-fit:contain;
}

/* ===== WISH CARD GRID ===== */
.wish-grid {
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px;
}

/* ===== WISH CARD ===== */
.wcard {
  background:var(--card-bg);
  border:1px solid rgba(79,195,247,0.12);
  border-radius:14px;
  padding:24px 18px;
  text-align:center;
  transition:all 0.35s ease;
  position:relative;
  overflow:hidden;
}
.wcard::before {
  content:''; position:absolute; inset:0; border-radius:14px;
  background:linear-gradient(135deg, rgba(79,195,247,0.06), transparent);
  opacity:0; transition:opacity 0.3s;
  pointer-events:none;
}
.wcard:hover {
  transform:translateY(-4px);
  border-color:rgba(79,195,247,0.35);
  box-shadow:0 0 24px rgba(79,195,247,0.12);
}
.wcard:hover::before { opacity:1; }

.wcard-icon { font-size:32px; margin-bottom:10px; display:block; }
.wcard-name { font-size:17px; font-weight:700; color:var(--text); margin-bottom:6px; }
.wcard-desc { font-size:13px; color:var(--text-dim); font-style:italic; line-height:1.5; margin-bottom:14px; }

.wcard-guide-toggle {
  display:inline-block; padding:6px 16px;
  border:1px solid rgba(79,195,247,0.3); border-radius:20px;
  font-size:12px; color:var(--cyan);
  cursor:pointer; position:relative; z-index:2; pointer-events:auto;
  transition:all 0.25s;
  user-select:none;
}
.wcard-guide-toggle:hover {
  background:rgba(79,195,247,0.1);
  border-color:rgba(79,195,247,0.5);
}

.wcard-guide {
  max-height:0; overflow:hidden;
  transition:max-height 0.4s ease, margin 0.4s ease, opacity 0.3s ease;
  opacity:0;
  text-align:left;
  margin-top:0;
}
.wcard-guide.expanded {
  max-height:2000px;
  opacity:1;
  margin-top:14px;
}
.wcard-guide-inner {
  background:rgba(79,195,247,0.04);
  border-radius:10px;
  padding:14px;
  font-size:12px; color:var(--text-dim);
  line-height:1.7;
  border:1px solid rgba(79,195,247,0.1);
}

/* ===== GUIDE PLATFORM MODAL ===== */
.guide-platform-overlay {
  position:fixed; inset:0; z-index:10000;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition:opacity 0.3s ease;
}
.guide-platform-overlay.active {
  opacity:1; pointer-events:auto;
}
.guide-platform-modal {
  background:linear-gradient(160deg, rgba(15,23,42,0.96) 0%, rgba(10,14,39,0.98) 100%);
  border:1px solid rgba(79,195,247,0.2);
  border-radius:16px;
  width:min(480px, 90vw);
  max-height:80vh;
  overflow-y:auto;
  box-shadow:0 0 60px rgba(0,0,0,0.5);
  transform:translateY(20px);
  transition:transform 0.3s ease;
}
.guide-platform-overlay.active .guide-platform-modal {
  transform:translateY(0);
}
.guide-platform-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 24px 14px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.guide-platform-title {
  font-size:16px; font-weight:700; color:var(--text);
}
.guide-platform-close {
  background:none; border:none;
  font-size:24px; color:var(--text-dim);
  cursor:pointer; line-height:1;
  transition:color 0.2s;
}
.guide-platform-close:hover { color:var(--text); }
.guide-platform-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:10px; padding:20px 24px 24px;
}
.guide-platform-btn {
  display:flex; align-items:center; gap:10px;
  padding:14px 16px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  cursor:pointer;
  transition:all 0.25s;
  color:var(--text);
  font-size:14px;
  text-decoration:none;
  user-select:none;
}
.guide-platform-btn:hover {
  background:rgba(79,195,247,0.12);
  border-color:rgba(79,195,247,0.35);
  transform:translateY(-1px);
}
.guide-platform-btn-icon {
  font-size:22px; flex-shrink:0;
}
.guide-platform-btn-label {
  font-weight:500;
}

/* ===== SCROLL ANIMATION ===== */
.anim-card {
  opacity:0; transform:translateY(30px);
  transition:opacity 0.6s ease, transform 0.6s ease;
}
.anim-card.visible { opacity:1; transform:translateY(0); }

/* ===== FOOTER ===== */
.footer {
  position:relative; z-index:1;
  text-align:center; padding:40px 24px;
  color:#4a5568; font-size:13px;
  border-top:1px solid rgba(255,255,255,0.04);
}
.footer span { color:var(--gold); }

/* ===== AI CHAT FAB ===== */
.ai-chat-fab {
  position:fixed; bottom:30px; right:30px; z-index:9998;
  width:60px; height:60px;
  border-radius:50%;
  background:linear-gradient(135deg, #d4af37 0%, #f5d76e 50%, #b8941f 100%);
  border:none;
  cursor:pointer;
  font-size:28px;
  color:#0a0e27;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 20px rgba(212,175,55,0.4);
  transition:transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.ai-chat-fab:hover {
  transform:scale(1.08);
  box-shadow:0 6px 28px rgba(212,175,55,0.6);
}
.ai-chat-fab.hidden { opacity:0; pointer-events:none; transform:scale(0.6); }

/* ===== AI CHAT PANEL ===== */
.ai-chat-panel {
  position:fixed; bottom:30px; right:30px; z-index:9997;
  width:380px; height:520px;
  border-radius:16px;
  background:rgba(10,14,39,0.97);
  border:1px solid rgba(212,175,55,0.2);
  box-shadow:0 8px 40px rgba(0,0,0,0.6);
  display:flex; flex-direction:column;
  overflow:hidden;
  transform:translateY(20px) scale(0.95);
  opacity:0;
  pointer-events:none;
  transition:transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease;
}
.ai-chat-panel.open {
  transform:translateY(0) scale(1);
  opacity:1;
  pointer-events:auto;
}

/* Chat Header */
.ai-chat-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px;
  border-bottom:1px solid rgba(212,175,55,0.15);
  background:rgba(212,175,55,0.06);
  flex-shrink:0;
}
.ai-chat-title {
  font-size:15px; font-weight:700;
  color:var(--gold);
  letter-spacing:0.5px;
}
.ai-chat-actions {
  display:flex; gap:8px; align-items:center;
}
.ai-chat-clear {
  background:none; border:none;
  color:var(--text-dim); font-size:12px;
  cursor:pointer; padding:2px 6px;
  transition:color 0.2s;
}
.ai-chat-clear:hover { color:#e74c3c; }
.ai-chat-close {
  background:none; border:none;
  color:var(--text-dim); font-size:20px;
  cursor:pointer; padding:0 2px;
  line-height:1;
  transition:color 0.2s;
}
.ai-chat-close:hover { color:var(--text); }

/* Chat Messages */
.ai-chat-messages {
  flex:1; overflow-y:auto;
  padding:16px;
  display:flex; flex-direction:column; gap:10px;
  scroll-behavior:smooth;
}
.ai-chat-messages::-webkit-scrollbar { width:4px; }
.ai-chat-messages::-webkit-scrollbar-track { background:transparent; }
.ai-chat-messages::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:2px; }

.chat-msg {
  max-width:85%;
  padding:10px 14px;
  border-radius:14px;
  font-size:13px; line-height:1.6;
  word-break:break-word;
  animation:msgIn 0.25s ease;
}
@keyframes msgIn {
  from { opacity:0; transform:translateY(8px); }
  to { opacity:1; transform:translateY(0); }
}
.chat-msg.user {
  align-self:flex-end;
  background:rgba(212,175,55,0.15);
  color:var(--text);
  border:1px solid rgba(212,175,55,0.2);
}
.chat-msg.ai {
  align-self:flex-start;
  background:rgba(255,255,255,0.06);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.06);
}
.chat-msg.error {
  align-self:flex-start;
  background:rgba(231,76,60,0.1);
  color:#e74c3c;
  border:1px solid rgba(231,76,60,0.2);
  font-size:12px;
}

/* Typing indicator */
.chat-typing {
  align-self:flex-start;
  display:flex; gap:4px; padding:10px 14px;
  background:rgba(255,255,255,0.06);
  border-radius:14px;
}
.chat-typing span {
  width:6px; height:6px;
  background:var(--gold);
  border-radius:50%;
  animation:dotBounce 1.4s ease-in-out infinite;
}
.chat-typing span:nth-child(2) { animation-delay:0.2s; }
.chat-typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes dotBounce {
  0%,80%,100% { transform:translateY(0); opacity:0.3; }
  40% { transform:translateY(-6px); opacity:1; }
}

/* Chat Input */
.ai-chat-input-wrap {
  display:flex; gap:8px; padding:12px 16px;
  border-top:1px solid rgba(212,175,55,0.12);
  background:rgba(0,0,0,0.3);
  flex-shrink:0;
}
.ai-chat-input {
  flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(212,175,55,0.2);
  border-radius:10px;
  padding:10px 12px;
  color:var(--text);
  font-size:13px;
  font-family:inherit;
  resize:none;
  outline:none;
  line-height:1.4;
  max-height:80px;
  transition:border-color 0.2s;
}
.ai-chat-input:focus {
  border-color:rgba(212,175,55,0.5);
}
.ai-chat-input::placeholder { color:rgba(255,255,255,0.25); }
.ai-chat-send {
  width:40px; height:40px;
  border-radius:10px;
  border:none;
  background:linear-gradient(135deg, #d4af37, #b8941f);
  color:#0a0e27;
  font-size:16px;
  cursor:pointer;
  flex-shrink:0;
  transition:opacity 0.2s, transform 0.15s;
  display:flex; align-items:center; justify-content:center;
}
.ai-chat-send:hover { opacity:0.85; }
.ai-chat-send:active { transform:scale(0.95); }
.ai-chat-send:disabled { opacity:0.4; cursor:not-allowed; }

/* ===== RESPONSIVE ===== */
@media (max-width:1200px) {
  .visited-grid, .wish-grid { grid-template-columns:repeat(3, 1fr); }
}
@media (max-width:768px) {
  .stats { gap:20px; }
  .stat-item { min-width:80px; }
  #mapContainer { height:400px; }
  .section { padding:48px 16px; }
  .visited-grid, .wish-grid { grid-template-columns:repeat(2, 1fr); gap:12px; }
  .tab-btn { padding:10px 24px; font-size:14px; }
  .ai-chat-fab { width:50px; height:50px; font-size:24px; bottom:20px; right:20px; }
  .ai-chat-panel {
    width:100vw; height:100vh;
    bottom:0; right:0;
    border-radius:0;
  }
}
@media (max-width:480px) {
  .visited-grid, .wish-grid { grid-template-columns:1fr; }
}

/* ===== SECTION DIVIDER ===== */
.section-divider {
  width:60px; height:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  margin:0 auto 16px;
  opacity:0.5;
}

/* ===== CITY DETAIL OVERLAY ===== */
.city-detail-overlay {
  position: fixed; inset: 0; z-index: 9996;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  display: flex; align-items: stretch; justify-content: flex-end;
  opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease;
}
.city-detail-overlay.active {
  opacity: 1; pointer-events: auto;
}

.city-detail-panel {
  width: min(680px, 95vw);
  height: 100%;
  background: linear-gradient(180deg, rgba(13,27,50,0.97) 0%, rgba(10,14,39,0.98) 100%);
  border-left: 1px solid rgba(212,175,55,0.15);
  box-shadow: -8px 0 40px rgba(0,0,0,0.5);
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
  overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column;
  position: relative;
}
.city-detail-overlay.active .city-detail-panel {
  transform: translateX(0);
}
.city-detail-panel::-webkit-scrollbar { width:4px; }
.city-detail-panel::-webkit-scrollbar-track { background:transparent; }

// ==================== STATS COUNTER ====================
function animateCounters() {
  document.querySelectorAll('.stat-number').forEach(el => {
    const target = parseInt(el.dataset.target);
    const duration = 2000;
    const start = performance.now();
    function update(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.floor(eased * target);
      if (progress < 1) requestAnimationFrame(update);
      else el.textContent = target;
    }
    requestAnimationFrame(update);
  });
}
new IntersectionObserver((entries, obs) => {
  entries.forEach(e => { if (e.isIntersecting) { animateCounters(); obs.disconnect(); } });
}, { threshold: 0.3 }).observe(document.querySelector('.hero'));

// ==================== IMAGE COMPRESSION ====================
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const maxW = 800;
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * (maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getStorageKey(name) {
  return 'travel_photos_' + encodeURIComponent(name);
}

function loadPhotos(name) {
  try {
    const raw = localStorage.getItem(getStorageKey(name));
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function savePhotos(name, photos) {
  try {
    localStorage.setItem(getStorageKey(name), JSON.stringify(photos));
  } catch(e) {
    if (photos.length > 1) {
      photos.shift();
      try { localStorage.setItem(getStorageKey(name), JSON.stringify(photos)); } catch(e2) {}
    }
  }
}

function generateCityIntro(city) {
  const parts = city.desc.split(/[，、。]/).filter(s => s.trim().length > 0);
  const poeticPhrase = parts.length > 0 ? parts[parts.length - 1].trim() : '';
  const attractions = parts.slice(0, -1).filter(s => s.trim().length > 0);
  const mainAttr = attractions.slice(0, 3).join('、');
  const year = new Date(city.date).getFullYear();
  return `${year}年到访${city.name}。${mainAttr ? '从' + mainAttr + '，' : ''}足迹遍布这座城市的每一个角落。${poeticPhrase ? poeticPhrase + '。' : ''}这座城市用它独特的魅力，在旅途中留下了深深的印记。`;
}

function openCityDetail(city) {

  const panel = document.getElementById('cityDetailPanel');

  const dateObj = new Date(city.date);
  const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
  const dd = String(dateObj.getDate()).padStart(2, '0');
  const dateStr = dateObj.getFullYear() + '年' + mm + '月' + dd + '日';

  const parts = city.desc.split(/[，、]/).filter(s => s.trim().length > 0);
  const attractions = parts.slice(0, -1).filter(s => s.trim().length > 0);

  panel.innerHTML = `
    <button class="city-detail-close" id="cityDetailClose">&times;</button>
    <div class="city-detail-header">
      <div class="city-detail-name">${city.name}</div>
      <div class="city-detail-date">到访日期：${dateStr}</div>
    </div>
    <div class="city-detail-body">

      <div class="city-detail-section-title">景点 / 地标</div>
      <div class="city-detail-attractions">
        ${attractions.map(a => `<span class="city-detail-tag">${a}</span>`).join('')}
      </div>
      <div class="city-detail-section-title">旅行相册</div>
      <div class="city-detail-photos" id="cityDetailPhotos"></div>
      <div class="city-detail-photo-info" id="cityDetailPhotoInfo"></div>

    </div>
  `;

  document.body.style.overflow = 'hidden';

  document.getElementById('cityDetailClose').addEventListener('click', (ev) => {
    ev.stopPropagation();
    closeCityDetail();
  });

  renderCityDetailPhotos(city.name);

  const fileInput = document.getElementById('cityDetailFileInput');
  fileInput.addEventListener('change', async function() {
    const files = Array.from(this.files);
    let current = loadCityPhotos(city.name);
    const remaining = 10 - current.length;
    const toAdd = files.slice(0, remaining);

    for (const f of toAdd) {
      try {
        const b64 = await compressImage(f);
        current.push(b64);
        if (current.length > 10) current = current.slice(0, 10);
        saveCityPhotos(city.name, current);
      } catch(e) { console.error('City photo upload failed', e); }
    }
    renderCityDetailPhotos(city.name);
    this.value = '';
  });
}

      trigger.innerHTML = '📷';
      trigger.title = current.length >= 5 ? '最多5张照片' : '点击上传照片';

        trigger.addEventListener('click', (ev) => {

          if (fileInput) {
            fileInput.click();
          } else {
            console.error('[PhotoUpload] fileInput not found for city:', v.name);
          }

      if (current.length > 0) {
        const cnt = document.createElement('span');
        cnt.className = 'vcard-photo-count';

      const files = Array.from(this.files);
      let current = loadPhotos(v.name);
      const remaining = 5 - current.length;
      const toAdd = files.slice(0, remaining);

      for (const f of toAdd) {
        try {
          const b64 = await compressImage(f);
          current.push(b64);
          if (current.length > 5) current = current.slice(0, 5);
          savePhotos(v.name, current);
        } catch(e) { console.error('Photo upload failed', e); }
      }
      renderPhotos();
      this.value = '';
    });
  });

  observeAnimCards();
}

// ==================== SCROLL ANIMATION ====================
function observeAnimCards() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.anim-card').forEach(c => observer.observe(c));
}

        emphasis:{ label:{ show:true }, itemStyle:{ borderColor:'#81d4fa', shadowBlur:16, symbolSize:16 } },
        zlevel:2,
      }
    ]
  };

  fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
    .then(r => r.json())
    .then(geoJson => { echarts.registerMap('china', geoJson); chart.setOption(option); })
    .catch(() => { chart.setOption(option); });

  window.addEventListener('resize', () => chart.resize());
}

// ==================== AI CHAT ====================
(function initAIChat() {
  const fab = document.getElementById('aiChatFab');
  const panel = document.getElementById('aiChatPanel');
  const closeBtn = document.getElementById('aiChatClose');
  const clearBtn = document.getElementById('aiChatClear');
  const messagesEl = document.getElementById('aiChatMessages');
  const inputEl = document.getElementById('aiChatInput');
  const sendBtn = document.getElementById('aiChatSend');

  const API_URL = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';
  const API_KEY = 'sk-50bbd5d26d4f410bb31e0b171428ba42';
  const MODEL = 'qwen-turbo';
  const STORAGE_KEY = 'travel_ai_chat_history';
  const MAX_HISTORY = 20;

  const SYSTEM_PROMPT = `你是一位专业的旅行规划助手，名叫"旅行小马"。你非常了解用户（小马）的旅行历史和未来计划。

## 用户已去过的地方（共49个，按时间排序）：
2013年：日照
2023年：淮安、青岛、南京
2024年：武汉、杭州、泰州、上海、苏州、扬州、洛阳、郑州、北京、合肥、九江、南昌、芜湖、上饶、黄山、泰安、镇江
2025年：济南、烟台、大连、哈尔滨、沈阳、马鞍山、无锡、常州、嘉兴、三亚、厦门、福州、香港、深圳、漳州、渭南、西安、银川、阿拉善盟、威海
2026年：宁波、台州、长沙、六安、湘潭、衡阳

## 用户想去的地方（共11个目的地）：
新疆伊犁赛里木湖、台湾本岛、云南大理洱海丽江玉龙雪山香格里拉、四川川西稻城九寨沟、内蒙古乌兰布统草原、广州、澳门、成都重庆、湖南张家界武陵源、恒山、雁荡山

## 你的能力：
1. 回答关于用户已去过地方的任何问题（景点推荐、美食、交通、住宿等）
2. 为用户想去的地方提供旅行建议、攻略、最佳季节、行程规划
3. 比较不同目的地的优劣，帮用户做决策
4. 根据用户去过的地方，分析旅行偏好，推荐类似目的地
5. 回答通用旅行问题（行李打包、旅行保险、签证等）
6. 你的知识截止到2025年，对于2025年后的信息请诚实说明

## 回复风格：
- 热情但专业，像朋友一样聊天
- 回答简洁有料，每次控制在200字以内，除非用户要求详细
- 善用emoji但不过度（每条1-2个即可）
- 如果用户问的问题与旅行无关，礼貌地引导回旅行话题`;

  let isOpen = false;
  let isLoading = false;

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }

  function saveHistory(messages) {
    try {
      const toSave = messages.filter(m => m.role !== 'system');
      if (toSave.length > MAX_HISTORY * 2) {
        toSave.splice(0, toSave.length - MAX_HISTORY * 2);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    } catch(e) { }
  }

  let chatMessages = loadHistory();

  function buildAPIMessages() {
    return [
      { role: 'system', content: SYSTEM_PROMPT },
      ...chatMessages
    ];
  }

  function scrollToBottom() {
    setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 50);
  }

  function addMessage(role, content) {
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = content;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function addError(text) {
    const div = document.createElement('div');
    div.className = 'chat-msg error';
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'chat-typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function callAI(userMessage) {
    chatMessages.push({ role: 'user', content: userMessage });
    if (chatMessages.length > MAX_HISTORY) {
      chatMessages = chatMessages.slice(-MAX_HISTORY);
    }

    const apiMessages = buildAPIMessages();

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + API_KEY
        },
        body: JSON.stringify({
          model: MODEL,
          messages: apiMessages,
          stream: false,
          max_tokens: 1024,
          temperature: 0.7
        })
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error?.message || '请求失败 (HTTP ' + response.status + ')');
      }

      const data = await response.json();
      const reply = data.choices[0].message.content;

      chatMessages.push({ role: 'assistant', content: reply });
      saveHistory(chatMessages);
      return reply;
    } catch(e) {
      chatMessages.pop();
      saveHistory(chatMessages);
      throw e;
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    isLoading = true;

    addMessage('user', text);
    showTyping();

    try {
      const reply = await callAI(text);
      hideTyping();
      addMessage('ai', reply);
    } catch(e) {
      hideTyping();
      addError('抱歉，请求出错了：' + (e.message || '网络异常，请检查连接后重试'));
    }

    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  function renderWelcome() {
    if (chatMessages.length === 0) {
      addMessage('ai', '你好！我是旅行小马 🐴 我知道你去过49座城市，还有11个想去的目的地。有什么旅行问题尽管问我～');
    } else {
      chatMessages.forEach(m => {
        if (m.role === 'user' || m.role === 'assistant') {
          addMessage(m.role === 'user' ? 'user' : 'ai', m.content);
        }
      });
    }
  }

  function openPanel() {
    isOpen = true;
    panel.classList.add('open');
    fab.classList.add('hidden');
    if (messagesEl.children.length === 0) {
      renderWelcome();
    }
    scrollToBottom();
  }

  function closePanel() {
    isOpen = false;
    panel.classList.remove('open');
    fab.classList.remove('hidden');
  }

  function clearChat() {
    chatMessages = [];
    localStorage.removeItem(STORAGE_KEY);
    messagesEl.innerHTML = '';
    addMessage('ai', '你好！我是旅行小马 🐴 我知道你去过49座城市，还有11个想去的目的地。有什么旅行问题尽管问我～');
  }

  fab.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  clearBtn.addEventListener('click', clearChat);
  sendBtn.addEventListener('click', sendMessage);

  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 80) + 'px';
  });
})();

console.log('[Init] All init complete');
</script>
